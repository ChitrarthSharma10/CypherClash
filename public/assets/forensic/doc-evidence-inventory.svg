  <text x="35" y="320" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0f172a">BARCODE VERIFICATION:</text>
  
  <!-- Mock Barcode lines -->
  <rect x="35" y="330" width="4" height="35" fill="#000"/>
  <rect x="42" y="330" width="2" height="35" fill="#000"/>
  <rect x="48" y="330" width="6" height="35" fill="#000"/>
  <rect x="58" y="330" width="2" height="35" fill="#000"/>
  <rect x="64" y="330" width="5" height="35" fill="#000"/>
  <rect x="74" y="330" width="3" height="35" fill="#000"/>
  <rect x="82" y="330" width="6" height="35" fill="#000"/>
  <rect x="92" y="330" width="2" height="35" fill="#000"/>
  <rect x="98" y="330" width="4" height="35" fill="#000"/>
  <rect x="106" y="330" width="6" height="35" fill="#000"/>
  <rect x="116" y="330" width="3" height="35" fill="#000"/>
  <rect x="124" y="330" width="5" height="35" fill="#000"/>
  <text x="35" y="380" font-family="monospace" font-size="7.5" fill="#64748b">*CC-EV-8820-MASTER-AUDIT*</text>
  
  <!-- Evidence Seal Badge -->
  <circle cx="360" cy="345" r="38" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="360" y="342" font-family="monospace" font-size="8.5" font-weight="bold" fill="#d97706" text-anchor="middle">OFFICIAL</text>
  <text x="360" y="354" font-family="monospace" font-size="8.5" font-weight="bold" fill="#d97706" text-anchor="middle">EVIDENCE</text>
  
  <line x1="25" y1="420" x2="475" y2="420" stroke="#cbd5e1" stroke-width="1"/>
  
  <rect x="25" y="430" width="450" height="75" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="2"/>
  <text x="35" y="452" font-family="monospace" font-size="8" font-weight="bold" fill="#0f172a">INVENTORY SUMMARY:</text>
  <text x="35" y="470" font-family="monospace" font-size="8" fill="#475569">All evidence containers sealed with tamper-evident tape. Item EV-8820-A</text>
  <text x="35" y="485" font-family="monospace" font-size="8" fill="#475569">released to Digital Forensics Laboratory for multiplexer container recovery</text>
  <text x="35" y="498" font-family="monospace" font-size="8" font-weight="bold" fill="#0284c7">(DFU Report #DFU-REP-2026-042).</text>
  
  <text x="25" y="535" font-family="monospace" font-size="8" fill="#64748b">RECORDING CLERK: S. Henderson, Evidence Custodian</text>
</svg>
