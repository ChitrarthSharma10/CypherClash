<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" width="520" height="500">
  <defs>
    <filter id="schem-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect x="10" y="10" width="500" height="480" rx="3" fill="#04121d" stroke="#0284c7" stroke-width="1.5" filter="url(#schem-shadow)"/>
  
  <!-- Blueprint grid lines -->
  <g stroke="rgba(2, 132, 199, 0.15)" stroke-width="0.8">
    <line x1="10" y1="50" x2="510" y2="50"/>
    <line x1="10" y1="100" x2="510" y2="100"/>
    <line x1="10" y1="150" x2="510" y2="150"/>
    <line x1="10" y1="200" x2="510" y2="200"/>
    <line x1="10" y1="250" x2="510" y2="250"/>
    <line x1="10" y1="300" x2="510" y2="300"/>
    <line x1="10" y1="350" x2="510" y2="350"/>
    <line x1="10" y1="400" x2="510" y2="400"/>
    <line x1="10" y1="450" x2="510" y2="450"/>
    
    <line x1="60" y1="10" x2="60" y2="490"/>
    <line x1="110" y1="10" x2="110" y2="490"/>
    <line x1="160" y1="10" x2="160" y2="490"/>
    <line x1="210" y1="10" x2="210" y2="490"/>
    <line x1="260" y1="10" x2="260" y2="490"/>
    <line x1="310" y1="10" x2="310" y2="490"/>
    <line x1="360" y1="10" x2="360" y2="490"/>
    <line x1="410" y1="10" x2="410" y2="490"/>
    <line x1="460" y1="10" x2="460" y2="490"/>
  </g>
  
  <!-- Header -->
  <rect x="25" y="25" width="470" height="32" fill="#082f49" rx="2"/>
  <text x="35" y="45" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38bdf8" letter-spacing="1">ARCHITECTURAL SCHEMATIC // BUILDING C SUB-BASEMENT LEVEL 2</text>
  
  <!-- Floorplan walls -->
  <!-- Hallway Corridor -->
  <rect x="50" y="80" width="420" height="70" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="60" y="120" font-family="monospace" font-size="9" fill="#7dd3fc">NORTH CORRIDOR [CAM-02 COVERAGE]</text>
  
  <!-- Camera 02 marker -->
  <circle cx="450" cy="95" r="7" fill="#ef4444"/>
  <text x="400" y="90" font-family="monospace" font-size="8" font-weight="bold" fill="#ef4444">CAM-02</text>
  <path d="M 445 100 L 370 145 L 390 85 Z" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2,2"/>
  
  <!-- Door B-04 -->
  <rect x="230" y="148" width="40" height="4" fill="#fbbf24"/>
  <text x="210" y="165" font-family="monospace" font-size="7.5" fill="#fbbf24">DOOR B-04 [CC-RD-04]</text>
  
  <!-- Server Room B-04 -->
  <rect x="160" y="170" width="220" height="190" fill="rgba(15, 23, 42, 0.6)" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="195" font-family="monospace" font-size="9.5" font-weight="bold" fill="#72efdd">SERVER ROOM B-04</text>
  
  <!-- Server Racks -->
  <rect x="180" y="215" width="50" height="120" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="185" y="275" font-family="monospace" font-size="7.5" fill="#94a3b8" transform="rotate(-90 185 275)">RACK AISLE A</text>
  
  <rect x="250" y="215" width="50" height="120" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="255" y="275" font-family="monospace" font-size="7.5" fill="#fca5a5" transform="rotate(-90 255 275)">RACK AISLE B-04*</text>
  
  <rect x="320" y="215" width="45" height="120" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="325" y="275" font-family="monospace" font-size="7.5" fill="#94a3b8" transform="rotate(-90 325 275)">RACK AISLE C</text>
  
  <!-- Camera 04 marker -->
  <circle cx="210" cy="185" r="7" fill="#ef4444"/>
  <text x="222" y="188" font-family="monospace" font-size="8" font-weight="bold" fill="#ef4444">CAM-04 (HIGH CORNER)</text>
  <path d="M 215 190 L 290 230 L 230 330 Z" fill="rgba(239, 68, 68, 0.18)" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2,2"/>
  
  <!-- Auxiliary Rooms -->
  <rect x="50" y="170" width="90" height="90" fill="none" stroke="#38bdf8" stroke-width="1"/>
  <text x="60" y="215" font-family="monospace" font-size="8" fill="#64748b">HVAC ROOM</text>
  
  <rect x="400" y="170" width="70" height="150" fill="none" stroke="#38bdf8" stroke-width="1"/>
  <text x="410" y="240" font-family="monospace" font-size="8" fill="#64748b">STAIRWELL 3</text>
  
  <!-- Legend Box -->
  <rect x="25" y="380" width="470" height="85" fill="#030712" stroke="#1e293b" stroke-width="1" rx="2"/>
  <text x="35" y="400" font-family="monospace" font-size="8.5" font-weight="bold" fill="#38bdf8">TOPOLOGY LEGEND:</text>
  <circle cx="45" cy="420" r="4" fill="#ef4444"/>
  <text x="60" y="423" font-family="monospace" font-size="8" fill="#e2e8f0">CCTV Surveillance Unit (CAM-02, CAM-04)</text>
  <rect x="260" y="416" width="12" height="6" fill="#fbbf24"/>
  <text x="280" y="423" font-family="monospace" font-size="8" fill="#e2e8f0">Card Access Reader B-04 (CC-RD-04)</text>
  <text x="35" y="450" font-family="monospace" font-size="8" fill="#94a3b8">INCIDENT FOCUS: Rack B-04 contains gateway switch SW-4 where bypass tap was spliced.</text>
</svg>
